# Builds the desktop app for Windows and Linux.
#
# - Pull requests and manual runs: build on both platforms and keep the
#   installers as workflow artifacts (proves Windows still compiles).
# - Tags `desktop-vX.Y.Z`: build and attach the installers to a draft
#   GitHub Release; publishing the draft is done by hand.
#
# Nothing is code signed, so Windows SmartScreen warns about an unknown
# publisher (see README.md).
name: Release builds

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  PNPM_VERSION: "10.14.0"
  LINUX_DEPS: >-
    build-essential pkg-config file patchelf
    libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
    libgtk-layer-shell-dev libdbus-1-dev libx11-dev

jobs:
  build:
    name: Build (${{ matrix.name }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.91.1

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -s typecheck

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        uses: actions/upload-artifact@v5.0.0
        with:
          name: quest-backlog-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  create-release:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Check the tag matches the app version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          conf_version="$(jq -r .version src-tauri/tauri.conf.json)"
          pkg_version="$(jq -r .version package.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          echo "tag=$tag_version tauri.conf.json=$conf_version package.json=$pkg_version Cargo.toml=$cargo_version"
          if [[ "$tag_version" != "$conf_version" || "$tag_version" != "$pkg_version" || "$tag_version" != "$cargo_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in tauri.conf.json, package.json and Cargo.toml."
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the draft release
        id: release
        uses: actions/github-script@v8.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            // Re-running the workflow reuses the draft instead of making another.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const existing = releases.find((release) => release.tag_name === tag && release.draft);
            if (existing) {
              core.setOutput('id', existing.id);
              return;
            }
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Quest Backlog ${process.env.VERSION}`,
              body: [
                'Windows: download the `-setup.exe` installer. It is not code signed, so SmartScreen may say "Windows protected your PC"; choose *More info*, then *Run anyway*.',
                '',
                'Linux: the `.AppImage` (make it executable and run it) or the `.deb` (Debian, Ubuntu).',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            core.setOutput('id', data.id);

  release:
    name: Release (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.91.1

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, bundle and upload to the draft release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}
